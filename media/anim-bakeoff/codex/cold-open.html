<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live AMA — Alex Coulombe Presents</title>
<style>
  :root{--bg:#0a0b0f;--paper:#f2f3f5;--teal:#2dd4bf;--amber:#fbbf24}
  *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg)}
  body{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--paper)}
  #stage{position:absolute;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:var(--bg);isolation:isolate}
  .grain{position:absolute;inset:0;pointer-events:none;opacity:.15;background-image:radial-gradient(#fff 0.55px,transparent 0.7px);background-size:6px 6px;mask-image:linear-gradient(90deg,transparent 8%,#000 70%)}
  .grid{position:absolute;inset:0;background:linear-gradient(90deg,transparent 127px,#ffffff10 128px,transparent 129px),linear-gradient(90deg,transparent 1791px,#ffffff10 1792px,transparent 1793px),linear-gradient(transparent 137px,#ffffff10 138px,transparent 139px),linear-gradient(transparent 947px,#ffffff10 948px,transparent 949px);opacity:0}
  .number{position:absolute;top:83px;right:128px;font-size:18px;letter-spacing:.3em;color:#9ba2a6;opacity:0}
  .topline{position:absolute;top:138px;left:128px;width:0;height:1px;background:#ffffff50}
  .accentline{position:absolute;top:138px;left:128px;width:0;height:2px;background:var(--teal);box-shadow:0 0 25px #2dd4bf7a}
  .kicker{position:absolute;left:128px;top:85px;margin:0;font-size:21px;font-weight:700;letter-spacing:.28em;opacity:0;color:var(--teal)}
  .title{position:absolute;left:122px;top:225px;width:1650px;margin:0;font-weight:720;letter-spacing:-.067em;font-size:119px;line-height:1.09}
  .line{display:block;overflow:hidden;padding:0 6px 13px}
  .line span{display:block;transform:translateY(120%);opacity:0;filter:blur(12px)}
  .line.one{font-size:154px;letter-spacing:-.075em;line-height:1.05}
  .line.one span{color:var(--paper)}
  .line.four span{color:#bdc8c9}
  .rule{position:absolute;left:128px;top:857px;width:0;height:3px;background:var(--amber);box-shadow:0 0 28px #fbbf2466}
  .date{position:absolute;left:128px;top:896px;margin:0;font-size:28px;font-weight:500;letter-spacing:.045em;color:#b4bdc0;opacity:0;transform:translateY(20px)}
  .live{position:absolute;right:127px;top:892px;display:flex;align-items:center;gap:14px;font-size:20px;letter-spacing:.18em;font-weight:650;opacity:0;transform:translateY(20px)}
  .live i{display:block;width:13px;height:13px;border-radius:50%;background:var(--amber);box-shadow:0 0 21px #fbbf24b0}
  .arc{position:absolute;width:730px;height:730px;right:-346px;top:155px;border:1px solid #2dd4bf3d;border-radius:50%;opacity:0;transform:scale(.76) rotate(-30deg)}
  .arc:after{content:"";position:absolute;inset:76px;border:1px solid #f2f3f519;border-radius:50%}
  .cross{position:absolute;right:72px;top:505px;width:120px;height:1px;background:#2dd4bf77;opacity:0}
  .cross:after{content:"";position:absolute;left:59px;top:-59px;width:1px;height:120px;background:#2dd4bf77}
  #stage.play .grid{animation:fade .7s .15s both}
  #stage.play .number{animation:fade .6s .75s both}
  #stage.play .topline{animation:extend 1.3s .16s cubic-bezier(.18,.8,.22,1) both}
  #stage.play .accentline{animation:accent 1.25s .24s cubic-bezier(.22,.78,.18,1) both}
  #stage.play .kicker{animation:kicker .75s .62s cubic-bezier(.16,1,.3,1) both}
  #stage.play .line.one span{animation:titleIn 1s 1.36s cubic-bezier(.16,1,.27,1) both}
  #stage.play .line.two span{animation:titleIn 1.05s 1.67s cubic-bezier(.16,1,.27,1) both}
  #stage.play .line.three span{animation:titleIn 1.05s 1.96s cubic-bezier(.16,1,.27,1) both}
  #stage.play .line.four span{animation:titleIn 1.05s 2.25s cubic-bezier(.16,1,.27,1) both}
  #stage.play .arc{animation:arc 2.4s 1.3s cubic-bezier(.16,1,.3,1) both}
  #stage.play .cross{animation:fade 1s 3.25s both}
  #stage.play .rule{animation:rule 1.05s 3.55s cubic-bezier(.16,1,.3,1) both}
  #stage.play .date,#stage.play .live{animation:rise .85s 4.15s cubic-bezier(.16,1,.3,1) both}
  #stage.play .live i{animation:glow 2.2s 4.8s ease-in-out 2}
  @keyframes fade{to{opacity:1}}@keyframes extend{to{width:1664px}}@keyframes accent{0%{width:0;transform:translateX(0)}55%{width:530px}100%{width:105px;transform:translateX(0)}}
  @keyframes kicker{from{opacity:0;transform:translateY(17px);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
  @keyframes titleIn{to{transform:translateY(0);opacity:1;filter:blur(0)}}
  @keyframes arc{to{opacity:1;transform:scale(1) rotate(0)}}@keyframes rule{to{width:1664px}}@keyframes rise{to{opacity:1;transform:none}}
  @keyframes glow{50%{box-shadow:0 0 40px #fbbf24;transform:scale(1.35)}}
</style>
</head>
<body>
<main id="stage" aria-label="Live stream title card">
  <div class="grid"></div><div class="grain"></div><div class="arc"></div><div class="cross"></div>
  <div class="topline"></div><div class="accentline"></div>
  <p class="kicker">ALEX COULOMBE PRESENTS</p><div class="number" aria-hidden="true">07 / 10 / 26</div>
  <h1 class="title" aria-label="Live AMA: Meta's VR Glasses, the Member Toolkit, and What's Next">
    <span class="line one"><span>Live AMA:</span></span>
    <span class="line two"><span>Meta's VR Glasses,</span></span>
    <span class="line three"><span>the Member Toolkit,</span></span>
    <span class="line four"><span>and What's Next</span></span>
  </h1>
  <div class="rule"></div><p class="date">October 7, 2026</p><div class="live" aria-hidden="true"><i></i>LIVE</div>
</main>
<script>
  const stage=document.getElementById('stage');
  function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(${(innerWidth-1920*s)/2}px,${(innerHeight-1080*s)/2}px) scale(${s})`}
  addEventListener('resize',fit);fit();
  window.__restart=()=>{stage.classList.remove('play');void stage.offsetWidth;stage.classList.add('play')};
  window.__restart();
</script>
</body>
</html>
